# Example agent_config.yaml for dynamic agent loading and configuration
agents:
  planner:
    model: "gemini-1.0-pro"
    max_tokens: 4096
    temperature: 0.2
    tools:
      - plan_decomposition
      - goal_refinement
  code_executor:
    model: "gpt-4-turbo"
    max_tokens: 2048
    temperature: 0.1
    tools:
      - code_generation
      - dockerfile_generation
  cloud_deployer:
    model: "gpt-4o-mini"
    max_tokens: 1024
    temperature: 0.15
    tools:
      - gcs_upload
      - cloud_build
      - cloud_run_deploy
